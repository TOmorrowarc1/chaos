name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: nightly-2020-06-04
        override: true
        components: rustfmt, clippy
    - name: Check code format
      run: cd kernel && cargo fmt -- --check

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, riscv32, riscv64, aarch64, mipsel]
    steps:
    - uses: actions/checkout@v2
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: nightly-2020-06-04
        components: rust-src, llvm-tools-preview

    - name: Cache cargo registry & build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          kernel/target
        key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('kernel/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-cargo-

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y device-tree-compiler qemu-system-x86 qemu-system-arm qemu-system-misc

    - name: Download prebuilt user image
      run: cd user && make sfsimg ARCH=${{ matrix.arch }} PREBUILT=1 && cd ..

    - name: Pre-fetch cargo deps (retry on network flake)
      run: |
        cd kernel
        for i in $(seq 1 5); do
          cargo fetch 2>&1 && break
          echo "Retry $i/5..."
          sleep 5
        done

    - name: Build kernel
      run: cd kernel && make build ARCH=${{ matrix.arch }} && cd ..

    - name: Smoke-test kernel (timeout = success)
      run: >
        timeout 30 sh -c 'cd kernel && make run ARCH=${{ matrix.arch }}'
        || [ $? -eq 124 ]

    - name: Build kernel with hypervisor
      if: matrix.arch == 'x86_64'
      run: cd kernel && make build ARCH=${{ matrix.arch }} HYPERVISOR=on && cd ..
